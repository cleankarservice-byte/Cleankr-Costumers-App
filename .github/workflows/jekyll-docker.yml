name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Generate APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false

    - name: Prepare Signing & Build Environment
      run: |
        chmod +x ./gradlew
        touch .env
        if [ ! -f debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Build Debug AAB (Play Store Bundle)
      run: ./gradlew bundleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Organize Artifacts
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/debug/app-debug.apk artifacts/Cleankr-v1.0.apk || true
        cp app/build/outputs/bundle/debug/app-debug.aab artifacts/Cleankr-v1.0.aab || true

    - name: Upload Cleankr APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cleankr-APK
        path: artifacts/Cleankr-v1.0.apk
        retention-days: 30

    - name: Upload Cleankr AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cleankr-AAB
        path: artifacts/Cleankr-v1.0.aab
        retention-days: 30

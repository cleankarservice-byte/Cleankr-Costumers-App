name: Build Android APK and AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Build Environment
        run: |
          chmod +x ./gradlew
          touch .env
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build APK and AAB
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew bundleDebug --no-daemon

      - name: Move to releases
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Cleankr-v1.0.apk
          cp app/build/outputs/bundle/debug/app-debug.aab releases/Cleankr-v1.0.aab
          echo "Files in releases folder:"
          ls -lh releases/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cleankr-APK-AAB
          path: releases/
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.0
          name: "Cleankr App v1.0.0"
          body: |
            ### 📱 Cleankr Customer Android App
            Sabhi Android devices (Android 7.0 se lekar Android 15/16) ke liye real APK aur Play Store bundle (AAB).
            
            - **Cleankr-v1.0.apk** - Direct mobile install
            - **Cleankr-v1.0.aab** - Play Store publish bundle
          files: |
            releases/Cleankr-v1.0.apk
            releases/Cleankr-v1.0.aab
          draft: false
          prerelease: false
          overwrite: true
        continue-on-error: true

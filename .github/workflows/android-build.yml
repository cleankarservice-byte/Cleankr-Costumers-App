name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build Debug APK & AAB
      run: ./gradlew assembleDebug bundleDebug --no-daemon

    - name: Upload Cleankr APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cleankr-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14

    - name: Upload Cleankr AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cleankr-AAB
        path: app/build/outputs/bundle/debug/app-debug.aab
        retention-days: 14

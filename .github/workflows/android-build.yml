name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Generate APK and AAB
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false

    - name: Prepare Signing & Build Environment
      run: |
        chmod +x ./gradlew
        touch .env

        # Ensure release keystore is ready for signing
        if [ ! -f release.keystore ]; then
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          elif [ -f release.keystore.base64 ]; then
            base64 -d release.keystore.base64 > release.keystore
          fi
        fi

        # Ensure debug keystore is ready
        if [ ! -f debug.keystore ]; then
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
        fi

        # Ensure google-services.json is present
        if [ ! -f app/google-services.json ]; then
          cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "19721903127",
            "project_id": "cleankr-724ce",
            "storage_bucket": "cleankr-724ce.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:19721903127:android:2a4149437565db06701052",
                "android_client_info": {
                  "package_name": "com.example"
                }
              },
              "api_key": [
                {
                  "current_key": "dummy"
                }
              ]
            }
          ]
        }
        EOF
        fi

    - name: Build Release AAB (Google Play Store Bundle)
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || 'cleankr2026' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || 'cleankr_release' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || 'cleankr2026' }}
      run: ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --stacktrace

    - name: Build Release APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD || 'cleankr2026' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || 'cleankr_release' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD || 'cleankr2026' }}
      run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --stacktrace

    - name: Verify Release Signature
      run: |
        keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -E "Owner|SHA256"

    - name: Organize Artifacts
      run: |
        mkdir -p artifacts
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk artifacts/Cleankr-v1.0.apk
        elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Cleankr-v1.0.apk
        fi
        if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
          cp app/build/outputs/bundle/release/app-release.aab artifacts/Cleankr-v1.0.aab
        fi
        ls -la artifacts/

    - name: Upload Cleankr APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cleankr-APK
        path: artifacts/Cleankr-v1.0.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload Cleankr AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cleankr-AAB
        path: artifacts/Cleankr-v1.0.aab
        if-no-files-found: warn
        retention-days: 30

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      continue-on-error: true
      with:
        tag_name: v1.0.0
        name: "Cleankr App v1.0.0 (Play Store Ready)"
        body: |
          ### 📱 Cleankr Android Application Release
          - **Cleankr-v1.0.aab**: Android App Bundle ready to upload to Google Play Console.
          - **Cleankr-v1.0.apk**: Standalone APK for direct mobile installation and testing.
        files: |
          artifacts/Cleankr-v1.0.apk
          artifacts/Cleankr-v1.0.aab
        draft: false
        prerelease: false
        overwrite: true
